<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D SPACE STATION</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #05000d;
        font-family: Arial, sans-serif;
    }

    #ui {
        position: fixed;
        top: 25px;
        left: 30px;
        z-index: 10;
        color: #eee;
        pointer-events: none;
        text-shadow: 0 0 12px #b86cff;
    }

    #ui h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 6px;
        color: #e5c8ff;
    }

    #ui p {
        margin-top: 6px;
        color: #bfa6d9;
        letter-spacing: 2px;
        font-size: 12px;
    }

    #controls {
        position: fixed;
        bottom: 25px;
        left: 30px;
        z-index: 10;
        color: #bda9d2;
        font-size: 12px;
        letter-spacing: 1px;
        pointer-events: none;
    }

    #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 7px;
        height: 7px;
        border: 1px solid #d9b5ff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        pointer-events: none;
        box-shadow: 0 0 10px #b45cff;
    }
</style>
</head>

<body>

<div id="ui">
    <h1>ORBITALIS</h1>
    <p>PURPLE NEBULA SOLAR OBSERVATORY</p>
</div>

<div id="controls">
    WASD — MOVE &nbsp;&nbsp; | &nbsp;&nbsp;
    MOUSE — LOOK &nbsp;&nbsp; | &nbsp;&nbsp;
    SHIFT — BOOST &nbsp;&nbsp; | &nbsp;&nbsp;
    ESC — RELEASE MOUSE
</div>

<div id="crosshair"></div>


<a-scene
    background="color:#020006"
    fog="type: exponential; color:#18002e; density:0.008"
    renderer="colorManagement:true; physicallyCorrectLights:true; antialias:true">


    <!-- ================================================= -->
    <!-- LIGHTING -->
    <!-- ================================================= -->

    <a-light
        type="ambient"
        color="#6b438f"
        intensity="0.35">
    </a-light>

    <a-light
        type="point"
        position="0 0 0"
        color="#b34cff"
        intensity="8"
        distance="80">
    </a-light>

    <a-light
        type="point"
        position="-20 8 -20"
        color="#7c2cff"
        intensity="4"
        distance="70">
    </a-light>

    <a-light
        type="point"
        position="20 -5 10"
        color="#5420a0"
        intensity="3"
        distance="50">
    </a-light>


    <!-- ================================================= -->
    <!-- PURPLE NEBULA -->
    <!-- ================================================= -->

    <a-sphere
        position="0 0 0"
        radius="80"
        material="
            shader:flat;
            color:#210044;
            opacity:0.18;
            transparent:true;
            side:back">
    </a-sphere>

    <a-sphere
        position="-35 15 -40"
        radius="35"
        material="
            shader:flat;
            color:#6d16c9;
            opacity:0.08;
            transparent:true;
            side:back">
    </a-sphere>

    <a-sphere
        position="40 -10 -30"
        radius="30"
        material="
            shader:flat;
            color:#a52cff;
            opacity:0.07;
            transparent:true;
            side:back">
    </a-sphere>

    <a-sphere
        position="0 20 -55"
        radius="25"
        material="
            shader:flat;
            color:#4d16a3;
            opacity:0.09;
            transparent:true;
            side:back">
    </a-sphere>


    <!-- ================================================= -->
    <!-- STARFIELD -->
    <!-- ================================================= -->

    <a-entity>

        <a-sphere position="-30 20 -45" radius="0.08" color="#ffffff"></a-sphere>
        <a-sphere position="-20 12 -55" radius="0.05" color="#d9b6ff"></a-sphere>
        <a-sphere position="-5 25 -50" radius="0.07" color="#ffffff"></a-sphere>
        <a-sphere position="15 18 -45" radius="0.06" color="#e6c7ff"></a-sphere>
        <a-sphere position="32 10 -55" radius="0.08" color="#ffffff"></a-sphere>

        <a-sphere position="45 25 -35" radius="0.05" color="#cfa6ff"></a-sphere>
        <a-sphere position="-45 15 -30" radius="0.07" color="#ffffff"></a-sphere>
        <a-sphere position="-40 -10 -50" radius="0.05" color="#d7b4ff"></a-sphere>

        <a-sphere position="-20 -15 -45" radius="0.06" color="#ffffff"></a-sphere>
        <a-sphere position="20 -20 -55" radius="0.07" color="#e2c7ff"></a-sphere>
        <a-sphere position="40 -15 -40" radius="0.06" color="#ffffff"></a-sphere>

        <a-sphere position="0 35 -60" radius="0.05" color="#ffffff"></a-sphere>
        <a-sphere position="10 5 -65" radius="0.04" color="#d9b6ff"></a-sphere>
        <a-sphere position="-15 5 -70" radius="0.06" color="#ffffff"></a-sphere>

        <a-sphere position="30 30 -70" radius="0.04" color="#cda7ff"></a-sphere>
        <a-sphere position="-35 -20 -65" radius="0.05" color="#ffffff"></a-sphere>

    </a-entity>


    <!-- ================================================= -->
    <!-- ORBIT RINGS -->
    <!-- ================================================= -->

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="4.5"
        radius-outer="4.53"
        color="#a85cff"
        material="shader:flat;opacity:0.55;transparent:true">
    </a-ring>

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="6.5"
        radius-outer="6.53"
        color="#9b4dff"
        material="shader:flat;opacity:0.45;transparent:true">
    </a-ring>

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="9"
        radius-outer="9.03"
        color="#934cff"
        material="shader:flat;opacity:0.4;transparent:true">
    </a-ring>

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="12"
        radius-outer="12.03"
        color="#8b45ed"
        material="shader:flat;opacity:0.35;transparent:true">
    </a-ring>

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="15"
        radius-outer="15.03"
        color="#8141db"
        material="shader:flat;opacity:0.3;transparent:true">
    </a-ring>

    <a-ring
        position="0 0 0"
        rotation="-90 0 0"
        radius-inner="19"
        radius-outer="19.03"
        color="#7137c5"
        material="shader:flat;opacity:0.25;transparent:true">
    </a-ring>


    <!-- ================================================= -->
    <!-- SUN -->
    <!-- ================================================= -->

    <a-sphere
        position="0 0 0"
        radius="1.5"
        color="#ffbd32"
        material="
            emissive:#ff8c00;
            emissiveIntensity:4;
            roughness:0.4">
    </a-sphere>

    <a-sphere
        position="0 0 0"
        radius="1.9"
        material="
            shader:flat;
            color:#ff8a00;
            opacity:0.16;
            transparent:true">
    </a-sphere>

    <a-sphere
        position="0 0 0"
        radius="2.4"
        material="
            shader:flat;
            color:#c63cff;
            opacity:0.07;
            transparent:true">
    </a-sphere>

    <a-text
        value="SUN"
        position="1.8 1.4 0"
        color="#ffd878"
        width="2">
    </a-text>


    <!-- ================================================= -->
    <!-- MERCURY -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 360 0;
            dur:18000;
            loop:true;
            easing:linear">

        <a-sphere
            position="4.5 0 0"
            radius="0.18"
            color="#77716c">
        </a-sphere>

        <a-text
            value="MERCURY"
            position="4.8 0.35 0"
            color="#d4c8dc"
            width="1.2">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- VENUS -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 -360 0;
            dur:30000;
            loop:true;
            easing:linear">

        <a-sphere
            position="6.5 0 0"
            radius="0.3"
            color="#d49a4a">
        </a-sphere>

        <a-sphere
            position="6.5 0 0"
            radius="0.38"
            material="
                shader:flat;
                color:#ffbd69;
                opacity:0.13;
                transparent:true">
        </a-sphere>

        <a-text
            value="VENUS"
            position="6.9 0.45 0"
            color="#ffd18a"
            width="1.3">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- EARTH + MOON -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 360 0;
            dur:42000;
            loop:true;
            easing:linear">

        <a-entity position="9 0 0">

            <!-- Earth atmosphere -->

            <a-sphere
                radius="0.72"
                material="
                    shader:flat;
                    color:#55aaff;
                    opacity:0.15;
                    transparent:true">
            </a-sphere>

            <!-- Earth -->

            <a-sphere
                radius="0.55"
                color="#1765a8">
            </a-sphere>

            <!-- Continents -->

            <a-sphere
                position="0.27 0.22 0.45"
                scale="0.28 0.18 0.08"
                color="#3f994c">
            </a-sphere>

            <a-sphere
                position="-0.28 -0.08 0.45"
                scale="0.25 0.14 0.08"
                color="#4ba653">
            </a-sphere>

            <a-sphere
                position="0.08 -0.3 0.47"
                scale="0.18 0.1 0.07"
                color="#438c45">
            </a-sphere>


            <!-- Moon orbit -->

            <a-entity
                animation="
                    property:rotation;
                    from:0 0 0;
                    to:0 360 0;
                    dur:7000;
                    loop:true;
                    easing:linear">

                <a-sphere
                    position="1.1 0 0"
                    radius="0.16"
                    color="#aaa">
                </a-sphere>

            </a-entity>

            <a-text
                value="EARTH"
                position="0.75 0.8 0"
                color="#80caff"
                width="1.5">
            </a-text>

        </a-entity>

    </a-entity>


    <!-- ================================================= -->
    <!-- MARS -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 -360 0;
            dur:55000;
            loop:true;
            easing:linear">

        <a-sphere
            position="12 0 0"
            radius="0.3"
            color="#a94332">
        </a-sphere>

        <a-sphere
            position="11.9 0.12 0.28"
            scale="0.12 0.05 0.08"
            color="#713026">
        </a-sphere>

        <a-text
            value="MARS"
            position="12.35 0.5 0"
            color="#e57965"
            width="1.3">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- JUPITER -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 360 0;
            dur:75000;
            loop:true;
            easing:linear">

        <a-entity position="15 0 0">

            <a-sphere
                radius="0.85"
                color="#c99b6d">
            </a-sphere>

            <!-- Jupiter atmospheric bands -->

            <a-torus
                rotation="90 0 0"
                radius="0.61"
                radius-tubular="0.07"
                color="#e0bd91">
            </a-torus>

            <a-torus
                rotation="90 0 0"
                radius="0.73"
                radius-tubular="0.06"
                color="#9b7152">
            </a-torus>

            <a-sphere
                position="0.55 -0.12 0.55"
                scale="0.22 0.1 0.12"
                color="#a94f3d">
            </a-sphere>

            <a-text
                value="JUPITER"
                position="0 1.2 0"
                color="#e8c9a7"
                width="1.8">
            </a-text>

        </a-entity>

    </a-entity>


    <!-- ================================================= -->
    <!-- SATURN -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 -360 0;
            dur:95000;
            loop:true;
            easing:linear">

        <a-entity position="19 0 0">

            <a-sphere
                radius="0.7"
                color="#d8bd82">
            </a-sphere>

            <a-ring
                rotation="70 0 0"
                radius-inner="0.9"
                radius-outer="1.55"
                material="
                    shader:flat;
                    color:#d8c29a;
                    opacity:0.8;
                    side:double">
            </a-ring>

            <a-ring
                rotation="70 0 0"
                radius-inner="1.12"
                radius-outer="1.30"
                material="
                    shader:flat;
                    color:#927c5e;
                    opacity:0.75;
                    side:double">
            </a-ring>

            <a-text
                value="SATURN"
                position="0 1.5 0"
                color="#ead7a7"
                width="1.7">
            </a-text>

        </a-entity>

    </a-entity>


    <!-- ================================================= -->
    <!-- URANUS -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 360 0;
            dur:115000;
            loop:true;
            easing:linear">

        <a-sphere
            position="23 0 0"
            radius="0.5"
            color="#79d7d8">
        </a-sphere>

        <a-sphere
            position="23 0 0"
            radius="0.58"
            material="
                shader:flat;
                color:#7ffcff;
                opacity:0.12;
                transparent:true">
        </a-sphere>

        <a-text
            value="URANUS"
            position="23.5 0.75 0"
            color="#91eff1"
            width="1.5">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- NEPTUNE -->
    <!-- ================================================= -->

    <a-entity
        animation="
            property:rotation;
            from:0 0 0;
            to:0 -360 0;
            dur:135000;
            loop:true;
            easing:linear">

        <a-sphere
            position="27 0 0"
            radius="0.48"
            color="#315ed4">
        </a-sphere>

        <a-sphere
            position="27 0 0"
            radius="0.57"
            material="
                shader:flat;
                color:#456fff;
                opacity:0.12;
                transparent:true">
        </a-sphere>

        <a-text
            value="NEPTUNE"
            position="27.5 0.75 0"
            color="#6f9cff"
            width="1.6">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- ORBITAL STATION -->
    <!-- ================================================= -->

    <a-entity position="0 5 7">

        <!-- Main central hub -->

        <a-sphere
            radius="1.2"
            color="#222630"
            material="
                metalness:0.8;
                roughness:0.25">
        </a-sphere>

        <!-- Glowing reactor core -->

        <a-sphere
            radius="0.55"
            color="#9c4dff"
            material="
                emissive:#8d28ff;
                emissiveIntensity:4">
        </a-sphere>


        <!-- Central spine -->

        <a-cylinder
            radius="0.3"
            height="5"
            rotation="90 0 0"
            color="#353a45"
            material="
                metalness:0.9;
                roughness:0.2">
        </a-cylinder>


        <!-- Rotating habitat ring -->

        <a-entity
            animation="
                property:rotation;
                from:0 0 0;
                to:0 360 0;
                dur:15000;
                loop:true;
                easing:linear">

            <a-torus
                rotation="90 0 0"
                radius="2.3"
                radius-tubular="0.18"
                color="#4c5363"
                material="
                    metalness:0.9;
                    roughness:0.2">
            </a-torus>

            <a-torus
                rotation="90 0 0"
                radius="2.3"
                radius-tubular="0.035"
                color="#b55cff"
                material="
                    emissive:#8b2cff;
                    emissiveIntensity:3">
            </a-torus>

        </a-entity>


        <!-- Solar panel arms -->

        <a-box
            position="-3 0 0"
            scale="3 0.15 0.9"
            color="#20294a"
            material="
                metalness:0.7;
                roughness:0.25">
        </a-box>

        <a-box
            position="3 0 0"
            scale="3 0.15 0.9"
            color="#20294a"
            material="
                metalness:0.7;
                roughness:0.25">
        </a-box>


        <!-- Solar panel surfaces -->

        <a-box
            position="-3 0.1 0"
            scale="2.6 0.03 0.75"
            color="#3f55a5">
        </a-box>

        <a-box
            position="3 0.1 0"
            scale="2.6 0.03 0.75"
            color="#3f55a5">
        </a-box>


        <!-- Docking ports -->

        <a-cylinder
            position="0 0 -2.8"
            rotation="90 0 0"
            radius="0.5"
            height="1"
            color="#464c58">
        </a-cylinder>

        <a-cylinder
            position="0 0 2.8"
            rotation="90 0 0"
            radius="0.5"
            height="1"
            color="#464c58">
        </a-cylinder>


        <!-- Station lights -->

        <a-sphere
            position="-1.8 0.4 0"
            radius="0.08"
            color="#8cffff"
            material="
                emissive:#45ffff;
                emissiveIntensity:5">
        </a-sphere>

        <a-sphere
            position="1.8 0.4 0"
            radius="0.08"
            color="#8cffff"
            material="
                emissive:#45ffff;
                emissiveIntensity:5">
        </a-sphere>

        <a-text
            value="ORBITAL STATION"
            position="-1.2 1.5 0"
            color="#dcb8ff"
            width="2.5">
        </a-text>

    </a-entity>


    <!-- ================================================= -->
    <!-- PURPLE COSMIC PARTICLES -->
    <!-- ================================================= -->

    <a-sphere
        position="-12 8 -15"
        radius="0.12"
        color="#c05cff"
        material="
            emissive:#a000ff;
            emissiveIntensity:4">
    </a-sphere>

    <a-sphere
        position="10 -5 -20"
        radius="0.1"
        color="#8e5cff"
        material="
            emissive:#7c00ff;
            emissiveIntensity:4">
    </a-sphere>

    <a-sphere
        position="-20 -4 -10"
        radius="0.08"
        color="#e27cff"
        material="
            emissive:#bd00ff;
            emissiveIntensity:4">
    </a-sphere>

    <a-sphere
        position="18 12 -12"
        radius="0.1"
        color="#b46cff"
        material="
            emissive:#8d00ff;
            emissiveIntensity:4">
    </a-sphere>


    <!-- ================================================= -->
    <!-- CAMERA -->
    <!-- ================================================= -->

    <a-entity
        position="0 3 13"
        camera
        look-controls
        wasd-controls="
            acceleration:20;
            fly:true;
            easing:true">
    </a-entity>


</a-scene>

</body>
</html>
